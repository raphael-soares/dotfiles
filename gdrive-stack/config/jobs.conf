# Jobs declarativos do gdrive-stack.
#
# Formato:  modo | origem (caminho REAL no host, sob SYNC_ROOT) | destino/tag
#   modo    -> "sync" (espelho uma-via no Drive) ou "backup" (versionado/restic)
#   origem  -> caminho absoluto no host; precisa estar sob SYNC_ROOT (montado :ro)
#   destino -> sync: subpasta sob SYNC_BASE no Drive (<SYNC_BASE>/<destino>)
#              backup: tag do snapshot no restic
#
# Edite à vontade: descomente / acrescente linhas. Linhas em branco e que
# começam com # são ignoradas. Pastas que não existem são puladas com aviso.

# --- exemplos (descomente os que quiser) ---
# sync   | /home/raphael/Notes      | notes
# sync   | /home/raphael/Documentos | documentos
# sync   | /home/raphael/Pictures   | pictures

# backup | /home/raphael/Notes      | notes
# backup | /home/raphael/Workspace  | workspace
# backup | /home/raphael/Documentos | documentos
