services:
  backup:
    build: .
    image: gdrive-backup-sync:local
    container_name: gdrive-backup-sync
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      RCLONE_CONFIG: /config/rclone.conf
      RCLONE_REMOTE: ${RCLONE_REMOTE:-gdrive}
      SYNC_BASE: ${SYNC_BASE:-sync}
      RESTIC_REPO_PATH: ${RESTIC_REPO_PATH:-restic-repo}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?defina RESTIC_PASSWORD no .env}
      BACKUP_HOST: ${BACKUP_HOST:-arch}
    volumes:
      - ./config:/config
      - ${SYNC_ROOT}:${SYNC_ROOT}:ro
      - restic-cache:/root/.cache/restic
volumes:
  restic-cache:
