version = 2

[defaults]
conflict_resolve = "local"
review = "automatic"

[app]
theme = "noctalia.json"
autostart = true

[[pair]]
id = "personal"
name = "Personal"
local = "/home/raphael/Personal"
remote = "Raphael:Personal"
enabled = true
presets = ["system_junk", "dev_dirs"]
filters = ["- *.mkv", "- *.mp4", "- *.iso", "- *.nsp", "- *.xci", "- *.nsz"]

