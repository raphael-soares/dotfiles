# Terminal
term xterm-256color

# Fonte
font_family JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.0

# Janela
window_decorations none
background_opacity 0.8
window_padding_width 18 24

cursor #c7b89d
selection_background #36393a
selection_foreground #c0b196

# Paleta (gruvbox material)
color0  #1e2122
color1  #ec6b64
color2  #a9b665
color3  #e0c080
color4  #7daea3
color5  #d3869b
color6  #86b17f
color7  #c0b196
color8  #404344
color9  #ec6b64
color10 #a9b665
color11 #e0c080
color12 #7daea3
color13 #d3869b
color14 #86b17f
color15 #c7b89d

background #1e2122
foreground #c0b196

# Atalhos
map alt+r reload_configuration
map ctrl+equal increase_font_size
map ctrl+minus decrease_font_size
map ctrl+0 reset_font_size
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Limpar terminal
map ctrl+l clear_scrollback
