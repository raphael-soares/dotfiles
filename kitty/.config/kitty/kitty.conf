include themes/noctalia.conf
# include themes/gruvbox-material.conf

font_family JetBrainsMono Nerd Font
font_size 10
disable_ligatures always
# Sem estas duas linhas texto claro e bordas saem mais grossos que no Alacritty.
text_composition_strategy legacy
box_drawing_scale 0.001, 0.75, 1.5, 2

# Em pt, nao px: 9 12 a 96 dpi sao os y = 12 e x = 16 do Alacritty.
window_padding_width 9 12
hide_window_decorations yes
confirm_os_window_close 0

enable_audio_bell no
cursor_blink_interval 0
shell_integration disabled

clipboard_control write-clipboard write-primary read-clipboard read-primary

clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection
map ctrl+equal change_font_size all +1.0
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map shift+enter send_text all \e[13;2u
