
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setal=\E[58:2::%p1%{65536}%/%d:%p1%{256}%/%{255}%&%d:%p1%{255}%&%dm'
set -as terminal-features ',*:usstyle'
set -g extended-keys always
set -g extended-keys-format csi-u

set-option -g prefix C-SPACE
unbind C-b
bind-key C-SPACE send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0
set -g focus-events on
set -g mouse on
set -g detach-on-destroy off

set -g renumber-windows on
setw -g mode-keys vi

set -g @agent_window_name '#{?#{m:π *,#{pane_title}},#{s|^π [^ ]* ||:pane_title},#{?#{&&:#{==:#{pane_current_command},claude},#{!=:#{pane_title},✳ Claude Code}},#{s|^✳ ||:pane_title},}}'
setw -g automatic-rename-format '#{?#{P:#{E:@agent_window_name}},#{=/60/…:#{P:#{E:@agent_window_name}}},#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}}'

set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=default fg=colour7'
set -g status-left '#{W:#[fg=colour7 bg=default bold ]#I #[fg=default bg=default],#[fg=colour9 bg=default bold]#I #[fg=default bg=default nobold]}'
set -g status-right '#[fg=colour7 bold]#S '
set -g status-left-length 40

setw -g window-status-current-style 'fg=colour9 bold'
setw -g window-status-current-format '#W'
setw -g window-status-style 'fg=colour7'
setw -g window-status-format ''
setw -g window-status-separator ''

# Sem -r: o -r deixa o cliente na key-table "prefix" por repeat-time (500ms)
# depois do movimento, e nesse intervalo h/j/k/l cruas ainda mexem no pane.
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

bind -r K resize-pane -U 10
bind -r J resize-pane -D 10
bind -r H resize-pane -L 10
bind -r L resize-pane -R 10

bind-key b set-option status
bind-key f run-shell "${HOME}/.config/tmux/tmux-sessionizer.sh"
bind-key S run-shell "${HOME}/.config/tmux/ssh-sessionizer.sh"
bind-key -n C-_ run-shell "${HOME}/.config/tmux/tmux-toggle-popup.sh"

# Pane lateral com o nvim no ultimo plano que o agente escreveu. Substitui o
# `select-layout -E` que vinha por padrao nesta tecla.
bind-key E run-shell "${HOME}/.local/bin/plano toggle"

bind-key o switch-client -l

# As sessoes popup-* sao detalhe do toggle de popup, nao lugar pra onde se
# navega. Some com elas do choose-tree.
bind-key s choose-tree -Zs -f '#{?#{m:popup-*,#{session_name}},0,1}'

# workmux: cada tarefa de agente ganha um worktree e uma janela. Os binds so
# existem se o binario estiver instalado.
if-shell 'command -v workmux >/dev/null' {
    bind-key a run-shell "${HOME}/.config/tmux/tmux-workmux.sh menu"
    bind-key C-s display-popup -h 80% -w 90% -E "workmux dashboard"
    bind-key e run-shell "workmux sidebar"
    bind-key C-a run-shell "workmux last-done"
}

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'



run '~/.config/tmux/plugins/tpm/tpm'
