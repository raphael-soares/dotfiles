set -g default-terminal "tmux-256color"
set -as terminal-features ',*:usstyle'
# O Alacritty se anuncia como xterm-256color, entao o tmux nao sabe que ele
# entende links OSC 8 e atualizacao sincronizada.
set -as terminal-features ',xterm-256color:hyperlinks:sync'
set -g extended-keys always
set -g extended-keys-format csi-u

set-option -g prefix C-SPACE
unbind C-b
bind-key C-SPACE send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0
set -g focus-events on
set -g mouse on
set -g focus-follows-mouse on
set -g detach-on-destroy off
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g prefix-timeout 3000
set -g initial-repeat-time 700
set -g repeat-time 400

set -g set-titles on
set -g set-titles-string '#S · #W'

set -g renumber-windows on
setw -g mode-keys vi

set -g @agent_window_name '#{?#{m:π *,#{pane_title}},#{s|^π [^ ]* ||:pane_title},#{?#{&&:#{==:#{pane_current_command},claude},#{!=:#{pane_title},✳ Claude Code}},#{s|^✳ ||:pane_title},}}'
setw -g automatic-rename-format '#{?#{P:#{E:@agent_window_name}},#{=/60/…:#{P:#{E:@agent_window_name}}},#{pane_current_command}#{?pane_dead,[dead],}}'

set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=default fg=colour7'
# Indice amarelo: janela tocou bell (agente ou comando terminou). Azul: algum
# pane reporta progresso (OSC 9;4), ex. build ou agente.
set -g status-left '#{W:#[range=window|#{window_index} fg=#{?window_bell_flag,colour3,#{?#{P:#{?#{!=:#{pane_pb_state},hidden},1,}},colour4,colour7}} bg=default bold]#I#[norange fg=default bg=default] ,#[range=window|#{window_index} fg=colour9 bg=default bold]#I#[norange fg=default bg=default nobold] }'
set -g status-right '#[fg=colour7 bold]#S '
set -g status-left-length 40

setw -g window-status-current-style 'fg=colour9 bold'
setw -g window-status-current-format '#{?client_prefix,#[fg=colour3],}#W#[fg=colour7 nobold dim]#{?window_zoomed_flag, zoom,}#{?pane_in_mode, #{s/-mode//:pane_mode},}'
setw -g window-status-style 'fg=colour7'
setw -g window-status-format ''
setw -g window-status-separator ''

set -g mode-style 'bg=colour0 fg=colour9 bold'
set -g message-style 'bg=default fg=colour7 fill=default'
set -g message-command-style 'bg=default fg=colour9 fill=default'
set -g copy-mode-match-style 'bg=colour0 fg=colour3'
set -g copy-mode-current-match-style 'bg=colour3 fg=colour0'
set -g copy-mode-current-line-number-style 'fg=colour9'
set -g menu-style 'bg=default fg=colour7'
set -g menu-selected-style 'bg=colour0 fg=colour9 bold'
set -g menu-border-style 'fg=colour0'
set -g menu-border-lines rounded
set -g popup-border-style 'fg=colour0'
set -g popup-border-lines rounded
set -g pane-border-style 'fg=colour0'
set -g pane-active-border-style '#{?pane_in_mode,fg=colour3,#{?synchronize-panes,fg=colour1,fg=colour7}}'
set -g tiled-layout-max-columns 3
set -g display-panes-colour colour7
set -g display-panes-active-colour colour9
set -g clock-mode-colour colour9

set -s copy-command 'wl-copy'
set -s set-clipboard on
# Leitura depende do Alacritty liberar OSC 52 de colar (terminal.osc52).
set -s get-clipboard request
set -g copy-mode-line-numbers hybrid
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind C-p previous-window
bind C-n next-window

# Sem -r: o -r deixa o cliente na key-table "prefix" por repeat-time (500ms)
# depois do movimento, e nesse intervalo h/j/k/l cruas ainda mexem no pane.
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

bind -r K resize-pane -U 10
bind -r J resize-pane -D 10
bind -r H resize-pane -L 10
bind -r L resize-pane -R 10

bind-key b set-option status
bind-key S run-shell "${HOME}/.config/tmux/ssh-sessionizer.sh"
# Uma sessao popup-<sessao> por sessao; C-_ dentro dela fecha o popup. O
# run-shell existe porque display-popup nao expande #{} no comando. Sem o
# detach-on-destroy, sair do ultimo shell pularia o popup pra outra sessao.
bind-key -n C-_ if -F '#{m:popup-*,#{session_name}}' detach-client {
    run-shell "tmux display-popup -c '#{client_name}' -E -w 80% -h 80% -d #{q:pane_current_path} \"tmux new -A -s 'popup-#{s/[^A-Za-z0-9_-]/_/:session_name}' ';' set detach-on-destroy on\""
}

bind-key o switch-client -l

# As sessoes popup-* sao detalhe do toggle de popup, nao lugar pra onde se
# navega. Some com elas do choose-tree.
bind-key s choose-tree -Zs -f '#{?#{m:popup-*,#{session_name}},0,1}'
bind-key w choose-tree -Zw -f '#{?#{m:popup-*,#{session_name}},0,1}'
bind-key Tab run-shell "${HOME}/.config/tmux/tmux-sessionizer.sh"

# workmux: cada tarefa de agente ganha um worktree e uma janela. Os binds so
# existem se o binario estiver instalado.
if-shell 'command -v workmux >/dev/null' {
    bind-key a run-shell "${HOME}/.config/tmux/tmux-workmux.sh menu"
    bind-key C-s display-popup -k -h 80% -w 90% -E "workmux dashboard"
    bind-key e run-shell "workmux sidebar"
    bind-key C-a run-shell "workmux last-done"
}
