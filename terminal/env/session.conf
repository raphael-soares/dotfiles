# The session environment: systemd reads it as environment.d (user services), ~/.profile
# sources it for the graphical login (greetd runs the session through sh) and the bashrc
# for every shell. One syntax works in all three: NAME=value, no quotes, no export.
# The shells source it only when SESSION_ENV is unset, so PATH is prepended once per login.
# Named 99-session so it sorts after systemd's 99-environment (/etc/environment), which
# sets BROWSER and EDITOR on some distros.
SESSION_ENV=1
XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-$HOME/.config}
XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
XDG_STATE_HOME=${XDG_STATE_HOME:-$HOME/.local/state}
XDG_CACHE_HOME=${XDG_CACHE_HOME:-$HOME/.cache}

# Dotfiles that ignore XDG unless told where to go (xdg-ninja).
CARGO_HOME=$XDG_DATA_HOME/cargo
RUSTUP_HOME=$XDG_DATA_HOME/rustup
NPM_CONFIG_USERCONFIG=$XDG_CONFIG_HOME/npm/npmrc
NPM_CONFIG_CACHE=$XDG_CACHE_HOME/npm
NPM_CONFIG_INIT_MODULE=$XDG_CONFIG_HOME/npm/config/npm-init.js
DOCKER_CONFIG=$XDG_CONFIG_HOME/docker
GNUPGHOME=$XDG_DATA_HOME/gnupg
AWS_CONFIG_FILE=$XDG_CONFIG_HOME/aws/config
GTK2_RC_FILES=$XDG_CONFIG_HOME/gtk-2.0/gtkrc
TF_PLUGIN_CACHE_DIR=$XDG_CACHE_HOME/terraform/plugin-cache
GOPATH=$XDG_DATA_HOME/go

PATH=$HOME/.local/bin:$CARGO_HOME/bin:$PATH
EDITOR=nvim
BROWSER=zen
