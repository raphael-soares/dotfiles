[idle.behavior.lock]
enabled = true

[idle.behavior.screen-off]
enabled = false

# Each sync runs as root through polkit and asks for the password; the desktop logs in alone anyway.
[shell.greeter_sync]
auto_sync = false

[bar.default]
position = "bottom"
start = [ "active_workspace" ]
center = [ "fedora", "taskbar" ]
end = [ "tray", "clipboard", "notifications", "network", "bluetooth", "volume", "input_volume", "clock" ]
margin_edge = 6
margin_ends = 6
radius = 12
radius_top_left = 12
radius_top_right = 12
radius_bottom_left = 12
radius_bottom_right = 12

[widget.fedora]
type = "control-center"
custom_image = "~/.config/noctalia/icons/fedora-symbolic.svg"
custom_image_colorize = true

[widget.taskbar]
pinned = [ "org.gnome.Nautilus", "herdr-app", "discord", "steam", "zapfast", "spotifast", "org.qbittorrent.qBittorrent" ]
icon_scale = 1.3
item_spacing = 10
pinned_opacity = 1.0

# The desktop always runs on the performance profile, so its switch goes.
[control_center]
hidden_tabs = [ "media", "weather", "screen-time", "power" ]
shortcuts = [ { type = "wifi" }, { type = "bluetooth" }, { type = "caffeine" }, { type = "nightlight" }, { type = "notification" } ]
