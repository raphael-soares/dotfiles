# Remove o perfil "Pro Audio" de todas as placas de audio.
#
# O ACP (camada de perfis herdada do PulseAudio) sintetiza um perfil "Pro Audio"
# para TODA placa ALSA, automaticamente. Ele expoe os canais PCM crus, sem
# mixagem nem roteamento, para uso pro/DAW/JACK de baixa latencia e multicanal.
# Para desktop normal e inutil e so polui a lista de perfis em todo dispositivo.
#
# api.acp.disable-pro-audio = true tira so esse perfil; os uteis (analog, HDMI,
# iec958) continuam. Se um dia precisar de pro audio para DAW, remova a linha.
#
# Vai por regra, nao por monitor.alsa.properties: nesta versao o WirePlumber so
# propaga a prop pro device via as rules do alsa monitor (match_rules_update_
# properties no alsa.lua), igual o 51-fuxi faz. O match device.name = "~alsa_card.*"
# (o ~ liga o padrao wildcard) casa todas as placas; match exato por device.api
# nao pega na criacao do device.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]
