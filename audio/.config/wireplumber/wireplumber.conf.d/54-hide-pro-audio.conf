# Tira o perfil "Pro Audio" que o ACP cria em toda placa ALSA; analog/HDMI continuam.
# Vai por rule, nao por monitor.alsa.properties: no WirePlumber 0.5 so a rule propaga
# a prop para o device. O "~" liga o wildcard; match exato por device.api nao pega.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]
