# O Fuxi-H3 declara a faixa inteira do 'PCM Playback Volume' como 0,00 a 0,39 dB, e atenua
# diferente em cada canal: fora do topo a direita sai mais baixa, e no valor 0 ela muta.
# O soft-mixer tira o volume do mixer do aparelho e aplica no PipeWire, onde os dois canais
# recebem o mesmo ganho. Quem prende o mixer do aparelho no topo e o mantem la entre boots
# e a regra udev /etc/udev/rules.d/91-fuxi-h3-mixer.rules, da camada sistema.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-XiiSound_Technology_Corporation_Fuxi-H3-00" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
