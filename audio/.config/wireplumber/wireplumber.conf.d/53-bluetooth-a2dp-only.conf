# Modulo audio (opcional, fora do bootstrap principal): forca todo dispositivo
# Bluetooth a so usar A2DP (estereo, alta fidelidade), removendo os papeis
# handsfree HSP/HFP do monitor Bluetooth do WirePlumber.
#
# Motivo: caixa/soundbar BT barata (ex.: a A35, classe BT 0x240404 =
# alto-falante) costuma anunciar um perfil de headset com microfone fantasma.
# Ela conecta direto em HFP porque o transporte A2DP as vezes falha
# ("Failure in Bluetooth audio transport") e o WirePlumber usa o handsfree como
# muleta, derrubando tudo pra mono 16 kHz. Desligar so o autoswitch trata o
# sintoma: volta a nascer em HFP a cada reconexao/rename.
#
# Nesta versao do WirePlumber (0.5.x) os papeis/perfis sao decididos no MONITOR,
# nao por device (setar bluez5.roles por device nao remove os perfis HFP). Entao
# a alavanca que funciona de verdade e a global abaixo: sem os papeis hsp/hfp,
# nenhum device BT expoe handsfree, nao ha pra onde cair, nem por reconexao, nem
# por rename, nem por falha de transporte.
#
# Efeito colateral: nenhum fone BT tera microfone sem fio nesta maquina (todos
# ficam so A2DP). Se precisar de mic num fone BT de verdade, devolva
# hsp_hs hsp_ag hfp_hf a lista.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}
