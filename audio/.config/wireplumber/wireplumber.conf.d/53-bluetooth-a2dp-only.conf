# Caixa BT barata cai em HFP (mono 16 kHz) quando o A2DP falha. No WirePlumber 0.5
# os papeis sao do monitor, nao do device: tirar hsp/hfp aqui e o que impede a queda.
# Efeito colateral: nenhum fone BT tem microfone; para ter, devolva hsp_hs hsp_ag hfp_hf.
# SBC-XQ desligado porque engasga em receptor barato; o SBC padrao continua.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.enable-sbc-xq = false
}
