config_version = 14

[audio]
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 1.0
    border = "#ffffff14"
    border_width = 1.0
    center = []
    concave_edge_corners = false
    end = [
        "tray",
        "clipboard",
        "notifications",
        "battery",
        "network",
        "bluetooth",
        "volume",
        "input_volume",
        "control-center",
        "clock"
    ]
    hover_highlight = false
    margin_edge = -1
    margin_ends = -1
    padding = 16
    radius = 0
    radius_top_left = 0
    radius_top_right = 0
    shadow = false
    start = [ "active_workspace" ]
    thickness = 38
    widget_spacing = 12

[brightness]
enable_ddcutil = true
minimum_brightness = 0.099999997764825821
sync_all_monitors = true

[control_center]
hidden_tabs = [ "weather", "screen-time" ]
sidebar = "full"
sidebar_section = "none"
width = 880

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1762.0
    cy = 1006.4000244140625
    flip_x = true
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        background_opacity = 0.0
        background_padding = 0
        background_radius = 0
        bands = 128
        color_1 = "error"
        mirrored = false
        reversed = false
        show_when_idle = false

[dock]
background_opacity = 0.99999997764825821

[hooks]
session_locked = "if [ \"$(pactl get-sink-mute alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink)\" = \"Mute: no\" ]; then pactl set-sink-mute alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink 1 && touch \"$XDG_RUNTIME_DIR/lock-muted-speaker\"; fi; for p in $(busctl --user list --no-legend | awk '$1 ~ /^org[.]mpris[.]MediaPlayer2[.]/ {print $1}'); do busctl --user call \"$p\" /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player Pause; done"
session_unlocked = "if [ -e \"$XDG_RUNTIME_DIR/lock-muted-speaker\" ]; then pactl set-sink-mute alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink 0; rm -f \"$XDG_RUNTIME_DIR/lock-muted-speaker\"; fi"

[idle.behavior.lock]
enabled = true

[idle.behavior.screen-off]
enabled = true

[location]
auto_locate = true

