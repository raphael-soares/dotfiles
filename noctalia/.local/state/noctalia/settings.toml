[nightlight]
enabled = true

[notification]
background_opacity = 0.99999997764825821

[osd]
background_opacity = 1.0
offset_y = 20
position = "bottom_center"
position_vertical = "bottom_right"

    [osd.kinds]
    media = false

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"

[plugin_settings."tadomika_ari/w-engine"]
w-engine-panel_position = "center"

[plugins]
enabled = [ "raphael/hypr-displays", "raphael/hypr-active-workspace", "raphael/hypr-shots" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/raphael/.config/noctalia-plugins"
    name = "dev"

[shell]
button_borders = false
input_borders = false
polkit_agent = true
settings_window_translucent = false

    [shell.animation]
    speed = 2.0000000298023224

    [shell.greeter_sync]
    auto_sync = true

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "EN"
    "Portuguese (Brazil)" = "BR"

    [shell.launcher]
    categories = false
    fetch_exchange_rates = false
    show_app_origin_indicator = false

        [shell.launcher.providers.calculator]
        global = false

    [shell.mpris]
    blacklist = [ "firefox" ]

    [shell.panel]
    clipboard_placement = "floating"
    clipboard_position = "top_center"
    control_center_placement = "floating"
    open_near_click_launcher = true
    session_placement = "floating"
    session_position = "top_center"
    wallpaper_placement = "floating"
    wallpaper_position = "top_center"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/raphael/Pictures/Screenshots"

    [shell.shadow]
    alpha = 0.34999999999999998

[theme]
builtin = "Kanagawa"
community_palette = "ADW"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4" ]
    community_ids = [ "spicetify", "zen-browser", "discord", "libreoffice", "obs", "zathura", "hyprtoolkit" ]

[wallpaper]
directory = "/home/raphael/Pictures/Wallpaper"

    [wallpaper.default]
    path = "/home/raphael/Pictures/Wallpaper/forest-4.jpg"

    [wallpaper.last]
    path = "/home/raphael/Pictures/Wallpaper/forest-4.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/raphael/Pictures/Wallpaper/forest-4.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/raphael/Pictures/Wallpaper/forest-4.jpg"

    [[wallpaper.favorite]]
    community_palette = "Gruvbox Material Hard"
    palette_source = "community"
    path = "/home/raphael/Pictures/Wallpaper/forest-4.jpg"
    theme_mode = "auto"

[widget.active_window]
display = "text_only"
font_weight = 700
max_length = 380

[widget.active_workspace]
font_weight = 600
format = "Desktop {name}"
type = "raphael/hypr-active-workspace:active-workspace"

[widget.audio_visualizer]
bands = 40
color_1 = "error"
color_2 = "tertiary"
mirrored = false
width = 40

[widget.battery]
display_mode = "graphic"
hide_when_full = true
hide_when_plugged = true
scale = 0.80000000000000004
show_label = false

[widget.bluetooth]
hide_when_adapter_off = true
hide_when_no_connected_device = true

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%a. %-d de %b. %H:%M}"

[widget.control-center]
glyph = "adjustments-horizontal"

[widget.input_volume]
hide_when_inactive = true
show_label = false

[widget.network]
show_label = false
show_vpn_label = true

[widget.notifications]
hide_when_no_unread = true

[widget.tray]
color = "on_surface"
detached_panel = true
drawer = true

[widget.volume]
hide_when_inactive = true
show_label = false