id = "raphael/hypr-displays"
name = "Hypr Displays"
version = "2.0.0"
plugin_api = 24
author = "raphael"
license = "MIT"
icon = "device-desktop"
description = "Monitor mode picker for Hyprland: extend, external only, internal only."
tags = ["hyprland", "panel", "system", "utility"]
dependencies = ["hyprctl"]

[[panel]]
id = "modes"
entry = "panel.luau"
width = 420
height = 260
placement = "floating"
position = "center"
open_near_click = false
keyboard_focus = "exclusive"
capture_keys = ["1", "2", "3", "Up", "Down", "Return", "KP_Enter"]
