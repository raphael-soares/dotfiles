# Config global do workmux. So o que foge do default, cada um com o motivo.

nerdfont: true

# Com agent explicito o painel do agente abre em qualquer repo; sem ele, so
# em repo com CLAUDE.md.
agent: omp

# O default (<repo>__worktrees ao lado do repo) cai na pasta que o
# sessionizer varre, e as worktrees aparecem como projetos.
worktree_dir: ~/.workmux/{project}

# O tmux.conf deixa window-status-format vazio e mostra janelas pelo indice.
# Com o default, o workmux poe #I:#W em cada janela dele e duplica a barra.
status_format: false

# O spinner default ocupa 2 celulas e parece icone duplicado.
status_icons:
  working: "#[fg=colour3]•#[fg=default]"

# Largura fixa: sem ela o workmux trata mudanca de largura do pane como
# resize manual e espalha o valor pra todas as sessoes. Mesma ordem dos
# indices da barra do tmux.
sidebar:
  sort: window
  width: 52
