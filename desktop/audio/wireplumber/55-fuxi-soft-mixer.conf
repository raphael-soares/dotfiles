# The Fuxi-H3 declares the whole 'PCM Playback Volume' range as 0,00 to 0,39 dB, and attenuates
# each channel differently: below the top the right one comes out quieter, and at 0 it mutes.
# Soft-mixer takes the volume off the device's mixer and applies it in PipeWire, where both channels
# get the same gain. What pins the device's mixer at the top and keeps it there between boots
# is the udev rule /etc/udev/rules.d/91-fuxi-h3-mixer.rules, from the system layer.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-XiiSound_Technology_Corporation_Fuxi-H3-00" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
