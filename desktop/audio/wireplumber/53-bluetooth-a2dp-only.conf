# A cheap BT speaker drops to HFP (mono 16 kHz) when A2DP fails. In WirePlumber 0.5
# roles belong to the monitor, not the device: removing hsp/hfp here is what prevents the drop.
# Side effect: no BT headset has a microphone; to get one back, restore hsp_hs hsp_ag hfp_hf.
# SBC-XQ is off because it stutters on a cheap receiver; plain SBC still works.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.enable-sbc-xq = false
}
