# Removes the "Pro Audio" profile that ACP creates on every ALSA card; analog/HDMI stay.
# Done by rule, not by monitor.alsa.properties: in WirePlumber 0.5 only a rule propagates
# the prop to the device. The "~" enables the wildcard; an exact match on device.api does not catch it.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]
