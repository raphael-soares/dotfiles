version = 2

[defaults]
conflict_resolve = "local"
review = "automatic"

[app]
theme = "dark"
autostart = true

[[pair]]
id = "documents"
name = "Documents"
local = "/home/raphael/Documents"
remote = "Raphael:Documents"
enabled = true
presets = ["system_junk", "dev_dirs"]
filters = ["- /TEAjudo/Engineering/environment-files/**", "- *.mkv", "- *.mp4", "- *.iso", "- *.nsp", "- *.xci", "- *.nsz"]
