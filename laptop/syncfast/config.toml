version = 2

[defaults]
conflict_resolve = "local"
review = "automatic"

[app]
theme = "dark"
autostart = true

[[pair]]
id = "drive"
name = "Drive"
local = "/home/raphael/Drive"
remote = "Raphael:"
enabled = true
presets = ["system_junk", "dev_dirs", "git_repos"]
filters = ["- /Backups/**", "- /Personal/Wallpaper/wallz/**", "- /Personal/Wallpaper/forest-4.jpg", "- *.mkv", "- *.iso", "- *.nsp", "- *.xci", "- *.nsz"]
