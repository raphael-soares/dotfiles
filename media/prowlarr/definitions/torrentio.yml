---
id: torrentio
name: Torrentio
description: "Torrentio, the Stremio addon, without a debrid service"
language: en-US
type: public
encoding: UTF-8
followredirect: false
testlinktorrent: false
requestDelay: 2
links:
  - https://torrentio.strem.fun/

caps:
  categories:
    Movies: Movies
    TV: TV

  modes:
    search: [q]
    movie-search: [q, imdbid]
    tv-search: [q, imdbid, season, ep]
  allowrawsearch: false

settings:
  - name: default_opts
    type: text
    label: Torrentio options
    default: "sort=qualitysize|qualityfilter=scr,cam"
  - name: validate_imdb_movie
    type: text
    label: IMDb id of a movie used when Prowlarr or Radarr test the indexer
    default: "tt0137523"
  - name: validate_imdb_tv
    type: text
    label: IMDb id of a show used when Sonarr tests the indexer
    default: "tt0903747"

search:
  paths:
    - path: "{{ .Config.default_opts }}/stream/movie/{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Config.validate_imdb_movie }}{{ end }}.json"
      method: get
      response:
        type: json
        noResultsMessage: '"streams":[]'
      categories: [Movies]
    - path: "{{ .Config.default_opts }}/stream/series/{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Config.validate_imdb_tv }}{{ end }}:{{ if .Query.Season }}{{ .Query.Season }}{{ else }}1{{ end }}:{{ if .Query.Ep }}{{ .Query.Ep }}{{ else }}1{{ end }}.json"
      method: get
      response:
        type: json
        noResultsMessage: '"streams":[]'
      categories: [TV]

  rows:
    selector: streams
    missingAttributeEqualsNoResults: true

  fields:
    title:
      selector: title
      filters:
        - name: split
          args: ["\n", 0]
    category_is_tv_show:
      text: "{{ .Result.title }}"
      filters:
        - name: regexp
          args: "\\b(S\\d+(?:E\\d+)?)\\b"
    category:
      text: "{{ if .Result.category_is_tv_show }}TV{{ else }}Movies{{ end }}"
    infohash:
      selector: infoHash
    details:
      text: "https://torrentio.strem.fun/"
    seeders:
      selector: title
      filters:
        - name: regexp
          args: "👤 (\\d+)"
    leechers:
      text: "0"
    size:
      selector: title
      filters:
        - name: regexp
          args: "💾 (\\d+(?:\\.\\d+)? [KMGT]B)"
