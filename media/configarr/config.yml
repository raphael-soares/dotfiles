radarr:
  main:
    base_url: http://radarr:7878
    api_key: !env RADARR__AUTH__APIKEY

    # Every grab is a release the owner picked in Stremio: accept any quality, never upgrade.
    quality_profiles:
      - name: Manual
        upgrade:
          allowed: false
        min_format_score: 0
        qualities:
          - name: Raw-HD
          - name: BR-DISK
          - name: Remux-2160p
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: HDTV-2160p
          - name: Remux-1080p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: DVD-R
          - name: DVD
          - name: SDTV
          - name: DVDSCR
          - name: REGIONAL
          - name: TELECINE
          - name: TELESYNC
          - name: CAM
          - name: WORKPRINT
          - name: Unknown

    delete_unmanaged_quality_profiles:
      enabled: true
    delete_unmanaged_custom_formats:
      enabled: true

    media_naming:
      folder: default
      movie:
        rename: true
        standard: standard

    media_management:
      autoUnmonitorPreviouslyDownloadedMovies: true
      deleteEmptyFolders: true

    root_folders:
      - !env MEDIA_MOVIES

    download_clients:
      update_password: true
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          remove_completed_downloads: false
          remove_failed_downloads: true
          fields:
            host: host.docker.internal
            username: media
            password: !env QBITTORRENT_WEBUI_PASSWORD
            port: 8080
            movie_category: Movies
      config:
        enable_completed_download_handling: true

    notifications:
      data:
        - name: Jellyfin
          type: MediaBrowser
          events: { on_download: true, on_upgrade: true, on_rename: true, on_movie_delete: true, on_movie_file_delete: true }
          fields:
            host: jellyfin
            port: 8096
            apiKey: !env JELLYFIN_TOKEN
            updateLibrary: true

sonarr:
  main:
    base_url: http://sonarr:8989
    api_key: !env SONARR__AUTH__APIKEY

    quality_profiles:
      - name: Manual
        upgrade:
          allowed: false
        min_format_score: 0
        qualities:
          - name: Bluray-2160p Remux
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities: [WEBRip-2160p, WEBDL-2160p]
          - name: HDTV-2160p
          - name: Bluray-1080p Remux
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBRip-720p, WEBDL-720p]
          - name: Raw-HD
          - name: HDTV-1080p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: DVD
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: SDTV
          - name: Unknown

    delete_unmanaged_quality_profiles:
      enabled: true
    delete_unmanaged_custom_formats:
      enabled: true

    media_naming:
      series: default
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    media_management:
      autoUnmonitorPreviouslyDownloadedEpisodes: true
      deleteEmptyFolders: true

    root_folders:
      - !env MEDIA_SHOWS

    download_clients:
      update_password: true
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          remove_completed_downloads: false
          remove_failed_downloads: true
          fields:
            host: host.docker.internal
            username: media
            password: !env QBITTORRENT_WEBUI_PASSWORD
            port: 8080
            tv_category: Shows
      config:
        enable_completed_download_handling: true

    notifications:
      data:
        - name: Jellyfin
          type: MediaBrowser
          events: { on_download: true, on_upgrade: true, on_rename: true, on_series_delete: true, on_episode_file_delete: true }
          fields:
            host: jellyfin
            port: 8096
            apiKey: !env JELLYFIN_TOKEN
            updateLibrary: true

prowlarr:
  main:
    base_url: http://prowlarr:9696
    api_key: !env PROWLARR__AUTH__APIKEY

    tags:
      - flaresolverr

    indexer_proxies:
      data:
        - name: FlareSolverr
          type: FlareSolverr
          fields:
            host: http://flaresolverr:8191/
            requestTimeout: 60
          tags:
            - flaresolverr

    indexers:
      data:
        - { name: 1337x, definition: 1337x, enable: true, sync_profile: Standard, tags: [flaresolverr] }
        - { name: The Pirate Bay, definition: thepiratebay, enable: true, sync_profile: Standard }
        - { name: YTS, definition: yts, enable: true, sync_profile: Standard }
        - { name: EZTV, definition: eztv, enable: true, sync_profile: Standard, tags: [flaresolverr] }
        - { name: LimeTorrents, definition: limetorrents, enable: true, sync_profile: Standard }
        - { name: Knaben, definition: Knaben, enable: true, sync_profile: Standard }
        - { name: Nyaa, definition: nyaasi, enable: true, sync_profile: Standard }
        - { name: Anime Tosho, definition: animetosho-xyz, enable: true, sync_profile: Standard }
        - name: Torrentio
          definition: torrentio
          enable: true
          sync_profile: Standard
          fields:
            default_opts: "providers=yts,eztv,rarbg,1337x,thepiratebay,kickasstorrents,torrentgalaxy,magnetdl,horriblesubs,nyaasi,tokyotosho,anidex,rutor,rutracker,comando,bludv,torrent9,ilcorsaronero,mejortorrent,wolfmax4k,cinecalidad,besttorrents|sort=qualitysize|qualityfilter=scr,cam"

    applications:
      data:
        - name: Radarr
          type: Radarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://prowlarr:9696
            baseUrl: http://radarr:7878
            apiKey: !env RADARR__AUTH__APIKEY
        - name: Sonarr
          type: Sonarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://prowlarr:9696
            baseUrl: http://sonarr:8989
            apiKey: !env SONARR__AUTH__APIKEY
      sync_indexers: true
