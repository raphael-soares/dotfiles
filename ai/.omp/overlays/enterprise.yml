theme:
  dark: titanium-green
retry:
  modelFallback: false
# O credential_process de ~/.config/aws/config faz o omp oferecer amazon-bedrock sem login.
# enabledModels barra a escolha automatica; disabledProviders tira do /model.
enabledModels:
  - anthropic/*
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
  - ollama
  - lm-studio
  - llama.cpp
