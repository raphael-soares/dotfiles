modelRoles:
  slow: anthropic/claude-opus-5-5:xhigh
  task: anthropic/claude-sonnet-5-5:high
  smol: anthropic/claude-haiku-5-5
  tiny: anthropic/claude-haiku-4-5
  commit: anthropic/claude-haiku-5-5
  advisor: anthropic/claude-opus-5-5:medium
  default: anthropic/claude-opus-5-5
  speech: audiocpp/omnivoice
retry:
  modelFallback: false
  fallbackChains:
    speech: []
speechgen:
  enabled: true
task:
  agentModelOverrides:
    scout: anthropic/claude-sonnet-5-5:medium
    reviewer: "@task"
    security-reviewer: "@task"
  agentCompactionThresholdOverrides:
    task: 150000
    scout: 150000
  eager: default
  enableLsp: false
  maxRecursionDepth: 1
  softRequestBudget: 100
defaultThinkingLevel: auto
plan:
  defaultOnStartup: false
github:
  enabled: true
computer:
  enabled: true
dev:
  autoqaConsent: granted
setupVersion: 3
composer:
  shape: field
  tokenRate: false
statusLine:
  preset: minimal
  separator: block
  contextLine: percentage
  sessionAccent: false
  transparent: false
  compactThinkingLevel: true
  showHookStatus: false
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - status
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
terminal:
  showProgress: false
display:
  hideToolActivity: false
  shimmer: classic
  showTokenUsage: false
symbolPreset: nerd
tui:
  tight: false
  vimMode: true
  vimModeDisplay: text
  renderSvg: true
  resizeScrollback: append
  completeScrollback: false
  textSizing: false
externalThinking: false
completion:
  notify: "off"
theme:
  dark: titanium-purple
hideThinkingBlock: true
textVerbosity: low
compaction:
  idleEnabled: true
  thresholdTokens: 200000
autolearn:
  enabled: false
  autoContinue: false
memory:
  backend: sharpshooter
edit:
  mode: hashline
disabledProviders:
  - ollama
  - lm-studio
  - llama.cpp
update:
  auto: true
title:
  icons: nf+emoji
  generator: tiny
images:
  blockImages: false
claudeResets:
  autoRedeem5h: "no"