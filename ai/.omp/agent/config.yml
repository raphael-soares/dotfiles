modelRoles:
  slow: anthropic/claude-opus-5-5:xhigh
  task: anthropic/claude-sonnet-5.5:high
  smol: anthropic/claude-haiku-5-5
  tiny: anthropic/claude-haiku-4-5
  commit: anthropic/claude-haiku-5-5
  advisor: anthropic/claude-opus-5-5:medium
  default: anthropic/claude-opus-5-5
retry:
  modelFallback: true
  fallbackChains:
    anthropic/*:
      - opencode-go/kimi-k3:high
      - opencode-go/minimax-m3:high
      - opencode-go/glm-5.3-flash:high
    opencode-go/*:
      - opencode-go/glm-5.3-flash:high
      - opencode-go/muse-spark-1.3-contributor
task:
  agentModelOverrides:
    scout: "@smol"
    reviewer: "@task"
    security-reviewer: "@task"
  eager: always
  enableLsp: false
defaultThinkingLevel: auto
plan:
  defaultOnStartup: true
github:
  enabled: true
computer:
  enabled: true
dev:
  autoqaConsent: granted
setupVersion: 2
composer:
  shape: field
  tokenRate: false
statusLine:
  preset: custom
  separator: block
  contextLine: percentage
  sessionAccent: false
  transparent: false
  compactThinkingLevel: true
  showHookStatus: false
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - usage
    - status
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
terminal:
  showProgress: false
display:
  hideToolActivity: false
  shimmer: classic
  showTokenUsage: true
symbolPreset: nerd
tui:
  tight: false
  vimMode: true
  vimModeDisplay: text
  renderSvg: false
externalThinking: false
completion:
  notify: "off"
theme:
  dark: titanium-purple
hideThinkingBlock: true
textVerbosity: low
compaction:
  idleEnabled: true
autolearn:
  enabled: true
  autoContinue: true
memory:
  backend: sharpshooter
edit:
  mode: hashline